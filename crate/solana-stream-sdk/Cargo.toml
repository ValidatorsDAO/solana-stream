[package]
name = "solana-stream-sdk"
version = "5.0.0"
description = "Rust SDK for Solana streaming data"
authors = ["ELSOUL LABO B.V. <labo@elsoul.nl>"]
homepage = "https://elsoul.nl/"
edition = "2021"
rust-version = "1.98.1"
license = "Apache-2.0"
repository = "https://github.com/ValidatorsDAO/solana-stream"
keywords = ["solana", "blockchain", "streaming", "grpc", "shreds"]
categories = ["api-bindings", "network-programming"]

[features]
default = []
# UDP shred reception, shred decoding and signature checks (`shred`), and deshredding.
# The decoder is the SDK's own (Agave 4.4.1's shred format, checked against solana-ledger
# in tests/shred_differential.rs), so this feature builds neither solana-ledger nor
# RocksDB, OpenSSL or bzip2, and needs no [patch] or libclang. solana-rpc-client is for
# the leader schedule and block times; it uses reqwest with rustls.
udp = [
    "dep:bytes",
    "dep:solana-hash",
    "dep:solana-rpc-client",
    "dep:solana-sha256-hasher",
    "solana-signature/verify",
]

[dependencies]
futures = { workspace = true }
http = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
tonic = { workspace = true, features = ["tls-native-roots", "tls-webpki-roots"] }
tonic-prost = { workspace = true }
thiserror = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
serde_jsonc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
solana-packet = { workspace = true }
toml = "0.9"
url = { workspace = true }
yellowstone-grpc-client = { workspace = true }
yellowstone-grpc-proto = { workspace = true }
dashmap = { workspace = true }
bytes = { workspace = true, optional = true }
solana-entry = { workspace = true }
solana-hash = { workspace = true, optional = true }
solana-message = { workspace = true }
solana-pubkey = { workspace = true }
solana-signature = { workspace = true }
solana-transaction = { workspace = true }
solana-sdk-ids = { workspace = true }
solana-sha256-hasher = { workspace = true, optional = true }
solana-rpc-client = { workspace = true, optional = true }
chrono = { workspace = true }
log = { workspace = true }
wincode = { workspace = true }

[dev-dependencies]
flate2 = "1"
zstd = "0.13"
solana-hash = { workspace = true }
solana-keypair = { workspace = true }
solana-signer = { workspace = true }
# The tests make shreds with solana-ledger's Shredder (shreds_udp.rs, entries_wire.rs,
# shred_differential.rs) and compare the decoder with solana-ledger and its signature
# check, which takes the other three. Dev-dependencies only: users of the crate never
# build them. solana-ledger needs the rust-rocksdb [patch] in ../../Cargo.toml.
lazy-lru = "0.1.4"
solana-ledger = { workspace = true }
solana-nohash-hasher = "0.2.1"
solana-perf = "=4.4.1"


[[test]]
name = "entries_wire"
required-features = ["udp"]

[[test]]
name = "shred_differential"
required-features = ["udp"]

[build-dependencies]
protobuf-src = { workspace = true }
tonic-prost-build = { workspace = true }
