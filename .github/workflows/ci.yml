name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  endpoints:
    name: ERPC endpoints in docs and templates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: node scripts/check-erpc-endpoints.mjs

  hygiene:
    name: Secret scan and repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks over the whole history
        run: bash scripts/run-gitleaks.sh git --redact --config .gitleaks.toml --log-opts=--all .
      - name: Tracked-file hygiene gate
        run: bash scripts/check-oss-hygiene.sh
      - name: Hygiene gate self-test
        run: bash scripts/tests/check-oss-hygiene.test.sh
      - name: udp dependency gate self-test
        run: bash scripts/tests/check-udp-deps.test.sh

  deny:
    name: cargo deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --locked

  npm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit

  node:
    name: TypeScript SDK and Geyser templates (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The maintained LTS lines: 22 and 24 (maintenance), 26 (active).
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # Reads the pnpm version from packageManager. Node 25+ no longer ships corepack.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @validators-dao/solana-stream-sdk build
      - run: pnpm --filter @validators-dao/solana-stream-sdk test
      - name: Type-check and test the Geyser sample
        working-directory: client/geyser-ts
        run: |
          pnpm exec tsc --noEmit -p .
          pnpm test
      # The starters `slv bot init` hands out are standalone pnpm projects that install
      # the published SDK; check them the way a user gets them.
      - name: Install, type-check, test and build the TypeScript starters
        run: |
          set -euo pipefail
          for dir in temp-release/geyser-ts temp-release/shreds-ts; do
            echo "::group::$dir"
            (cd "$dir" && pnpm install && pnpm exec tsc --noEmit -p . && pnpm run --if-present test && pnpm build)
            echo "::endgroup::"
          done

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # librocksdb-sys runs bindgen; solana-ledger is a dev-dependency of the SDK (its tests
      # make shreds with Agave's Shredder and compare the decoder with it), so the tests
      # still build RocksDB.
      - name: Install libclang (bindgen for librocksdb-sys)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libclang-dev
      - name: Install the toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          cargo --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --locked
      # The SDK's udp tests (the shred decoder against solana-ledger) on their own: in the
      # workspace run they depend on a client enabling `udp`.
      - name: SDK tests with the udp feature
        run: cargo test -p solana-stream-sdk --features udp --locked
      - name: Build the SDK without the udp feature
        run: cargo check -p solana-stream-sdk --no-default-features --locked
      # What a user of `solana-stream-sdk/udp` builds (dev-dependencies excluded), on every
      # target: no solana-ledger, RocksDB, OpenSSL, native-tls or bzip2.
      - name: udp dependency gate
        run: |
          set -o pipefail
          cargo tree -p solana-stream-sdk --features udp -e normal,build --target all \
            --locked --prefix none | bash scripts/check-udp-deps.sh

  rust-starters:
    name: Rust starters (temp-release, published SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-starters
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # shreds-udp-rs is on the published SDK 4.0, whose udp feature builds RocksDB.
      - name: Install libclang (bindgen for librocksdb-sys)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libclang-dev
      - name: Install the toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          cargo --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            temp-release/geyser-rs -> ../../target-starters
            temp-release/shreds-rs -> ../../target-starters
            temp-release/shreds-udp-rs -> ../../target-starters
            temp-release/trade-app -> ../../target-starters
      # No lockfile on purpose: users resolve the newest compatible versions, so this
      # also catches an upstream change that breaks a starter.
      - name: cargo check every starter
        run: |
          set -euo pipefail
          for dir in geyser-rs shreds-rs shreds-udp-rs trade-app; do
            echo "::group::$dir"
            (cd "temp-release/$dir" && cargo check --all-targets)
            echo "::endgroup::"
          done
