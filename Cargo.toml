[workspace]
resolver = "3"
members = [
    "crate/solana-stream-sdk",
    "crate/r2-uploader",
    "client/shreds-rs",
    "client/geyser-rs",
    "client/shreds-udp-rs",
]
exclude = [
    "package/solana-shreds-client",
    "package/solana-entry-decoder",
    "temp-release/shreds-rs",
    "temp-release/geyser-rs",
    "temp-release/shreds-udp-rs",
    "temp-release/trade-app",
]

[workspace.package]
version = "5.0.0"
description = ""
authors = ["ELSOUL LABO B.V. <labo@elsoul.nl>"]
homepage = "https://elsoul.nl/"
edition = "2021"

[profile.release]
# thin has minimal overhead vs none (default): https://blog.llvm.org/2016/06/thinlto-scalable-and-incremental-lto.html
lto = "thin"

# The shred differential tests check hundreds of thousands of Ed25519 signatures and
# Merkle roots. Unoptimized, one verification takes 5 ms (a 64-shred erasure batch 330 ms
# to make); with these two crates optimized, 30 us (8 ms). Profiles apply only to builds of
# this workspace, not to users of the published crates.
[profile.dev.package.solana-ed25519]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

[workspace.dependencies]
anyhow = "1.0.100"
bincode = "1.3.3"
bs58 = "0.5.1"
bytes = "1"
chrono = "0.4.42"
clap = { version = "4.5.51", features = ["derive", "env"] }
dashmap = "6"
dotenvy = "0.15"
env_logger = "0.11.8"
futures = "0.3.31"
hex = "0.4.3"
http = "1"
json5 = "0.4.1"
log = "0.4"
prost = "0.14.4"
prost-types = "0.14.4"
protobuf-src = "1.1.0"
reqwest = { version = "0.12.24" }
serde_json = "1"
serde_jsonc = "1"
serde = "1"
# Solana: the Agave 4.4.1 crates and the companion crate majors Agave 4.4.1 uses.
solana-entry = { version = "=4.4.1", features = ["agave-unstable-api"] }
solana-hash = { version = "4.6.0", features = ["serde", "wincode"] }
solana-keypair = "4.0.0"
solana-ledger = { version = "=4.4.1", features = ["agave-unstable-api"] }
solana-message = { version = "5.0.0", features = ["serde", "wincode"] }
solana-packet = "4.3.0"
solana-pubkey = "4.3.0"
solana-rpc-client = { version = "=4.4.1", features = ["agave-unstable-api"] }
solana-sdk-ids = "3.1.0"
solana-sha256-hasher = { version = "3.1.0", features = ["sha2"] }
solana-signature = "3.5.2"
solana-signer = "4.0.0"
solana-stream-sdk = { path = "crate/solana-stream-sdk" }
solana-transaction = { version = "5.0.0", features = ["serde", "wincode", "verify"] }
thiserror = "2"
tokio = { version = "1.53.1" }
tonic = { version = "0.14.9" }
tonic-prost = "0.14.9"
tonic-prost-build = "0.14.9"
url = "2.5.7"
wincode = { version = "0.6.1", features = ["derive"] }
yellowstone-grpc-client = "17.0.0"
yellowstone-grpc-proto = "14.0.1"

# solana-ledger 4.4.1 builds only against Agave's rust-rocksdb fork, which Agave applies
# with this same patch. Here solana-ledger is only a dev-dependency (the SDK's differential
# shred tests); the `udp` feature does not use it, so a crate that enables
# `solana-stream-sdk/udp` needs no patch.
[patch.crates-io]
librocksdb-sys = { git = "https://github.com/anza-xyz/rust-rocksdb", rev = "4dba80dfe9434e595a971f5b2985ff9ba4fb31e7" }
rocksdb = { git = "https://github.com/anza-xyz/rust-rocksdb", rev = "4dba80dfe9434e595a971f5b2985ff9ba4fb31e7" }
