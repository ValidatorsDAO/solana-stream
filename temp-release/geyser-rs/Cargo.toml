[package]
name = "geyser-rs-temp-release"
version = "5.0.0"
description = "Rust client for Solana Geyser streaming"
homepage = "https://elsoul.nl/"
edition = "2021"
rust-version = "1.98.1"
license = "Apache-2.0"
repository = "https://github.com/ValidatorsDAO/solana-stream"
publish = false

[[bin]]
name = "geyser-rs-temp-release"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
bs58 = "0.5.1"
chrono = "0.4.42"
dashmap = "6"
dotenvy = "0.15"
env_logger = "0.11.8"
futures = "0.3.31"
hex = "0.4.3"
json5 = "0.4.1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jsonc = "1"
solana-stream-sdk = "5.0.0"
solana-rpc-client = { version = "=4.4.1", features = ["agave-unstable-api"] }
solana-pubkey = "4.3.0"
solana-signature = "3.5.2"
solana-hash = { version = "4.6.0", features = ["serde", "wincode"] }
thiserror = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tonic = "0.14.9"
url = "2.5.7"

